schema: privometry.rules/v1
rules:
  - id: read-env-file
    description: .env files and variants such as .env.local, but not .env.example.
    category: secrets
    when:
      action: [shell_exec, file_read]
      intent: secret_read
      target_path: ["*/.env", "*/.env.*"]
    verdict: ask
    message: The agent wants to read a .env file, which usually holds secrets.
  - id: read-ssh-key
    category: secrets
    when:
      action: [shell_exec, file_read]
      intent: secret_read
      target_path: "*/.ssh/*"
    verdict: ask
    message: The agent wants to read an SSH private key.
  - id: read-cloud-credentials
    category: secrets
    when:
      action: [shell_exec, file_read]
      intent: secret_read
      target_path: ["*/.aws/*", "*/.config/gcloud/*", "*/.azure/*", "*/.kube/*", "*/.docker/config.json"]
    verdict: ask
    message: The agent wants to read cloud or cluster credentials.
  - id: read-credential-store
    description: Any other credential store in the home folder, such as keychains, .netrc, .npmrc, .git-credentials or the GitHub CLI token.
    category: secrets
    when:
      action: [shell_exec, file_read]
      intent: secret_read
      path_class: secret_store
    unless:
      target_path: ["*/.ssh/*", "*/.aws/*", "*/.config/gcloud/*", "*/.azure/*", "*/.kube/*", "*/.docker/config.json"]
    verdict: ask
    message: The agent wants to read a credential store.
  - id: read-private-key-file
    category: secrets
    when:
      action: [shell_exec, file_read]
      intent: secret_read
      target_path: ["*.pem", "*.key", "*.p12", "*.pfx", "*.jks", "*.keystore", "*.ppk"]
    unless:
      target_path: "*/.ssh/*"
    verdict: ask
    message: The agent wants to read a private key or certificate file.
  - id: read-terraform-state
    category: secrets
    when:
      action: [shell_exec, file_read]
      intent: secret_read
      target_path: ["*.tfstate", "*.tfstate.backup"]
    verdict: ask
    message: Terraform state holds secrets in plain text; confirm the agent should read it.
  - id: read-credentials-file
    description: Credential files by name anywhere, such as credentials.json, service-account keys and secrets.yaml.
    category: secrets
    when:
      action: [shell_exec, file_read]
      intent: secret_read
      target_path: ["*/credentials", "*/credentials.json", "*/service-account*.json", "*/service_account*.json", "*/secrets.yaml", "*/secrets.yml", "*/secrets.json", "*/secret.yaml", "*/.htpasswd"]
    unless:
      path_class: secret_store
    verdict: ask
    message: The agent wants to read a credentials file.
