schema: privometry.rules/v1
rules:
  - id: secret-in-command
    description: A credential written out in a command, where it lands in shell history, logs and the agent's transcript.
    category: secrets
    when:
      action: shell_exec
      secret_detected: any
    verdict: ask
    message: The command contains a credential; use an environment variable or a secret manager instead.
  - id: secret-written-to-file
    description: A credential hardcoded into a file. Writing it to a local .env file is the expected place and is not asked about.
    category: secrets
    when:
      action: file_write
      secret_detected: any
    unless:
      target_path: ["*/.env", "*/.env.local", "*/.env.*.local"]
    verdict: ask
    message: The agent is writing a credential into a file.
  - id: secret-in-mcp-arguments
    description: A credential passed to an MCP tool, which may store or forward it.
    category: secrets
    when:
      action: mcp_call
      secret_detected: any
    verdict: ask
    message: The agent is passing a credential to an MCP tool.
