schema: privometry.ruletest/v1
tests:
  - name: asks when a command carries a token
    covers: secret-in-command
    facts: { action: shell_exec, program: gh, subcommand: auth login, secret_detected: [github_token], risk: medium }
    expect: { verdict: ask, rule: secret-in-command }
  - name: a command without a credential is not asked about for it
    covers: secret-in-command
    facts: { action: shell_exec, program: gh, subcommand: auth status, risk: low }
    expect: { verdict: allow }

  - name: asks when a key is hardcoded into code
    covers: secret-written-to-file
    facts: { action: file_write, target_path: /home/dev/api/src/config.ts, path_class: repo, target_class: code, secret_detected: [aws_access_key], risk: low }
    expect: { verdict: ask, rule: secret-written-to-file }
  - name: writing a credential into .env is expected
    covers: secret-written-to-file
    facts: { action: file_write, target_path: /home/dev/api/.env, path_class: repo, target_class: code, secret_detected: [stripe_key], risk: low }
    expect: { verdict: allow }
  - name: writing into .env.local is expected too
    facts: { action: file_write, target_path: /home/dev/api/.env.local, path_class: repo, target_class: code, secret_detected: [openai_api_key], risk: low }
    expect: { verdict: allow }
  - name: but .env.example must not hold real credentials
    facts: { action: file_write, target_path: /home/dev/api/.env.example, path_class: repo, target_class: code, secret_detected: [openai_api_key], risk: low }
    expect: { verdict: ask, rule: secret-written-to-file }

  - name: asks when an MCP tool is given a token
    covers: secret-in-mcp-arguments
    facts: { action: mcp_call, mcp_server: slack, mcp_tool: post_message, secret_detected: [github_token], risk: medium }
    expect: { verdict: ask, rule: secret-in-mcp-arguments }
  - name: a read-only MCP call without a credential is unaffected
    covers: secret-in-mcp-arguments
    facts: { action: mcp_call, mcp_server: github, mcp_tool: get_issue, risk: low }
    expect: { verdict: allow }
