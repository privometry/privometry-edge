schema: privometry.ruletest/v1
tests:
  - name: asks before printenv
    covers: dump-environment
    facts: { action: shell_exec, program: printenv, intent: [secret_read], category: [secrets], risk: high }
    expect: { verdict: ask, rule: dump-environment }
  - name: echo of one variable is not a dump
    covers: dump-environment
    facts: { action: shell_exec, program: echo, subcommand: $HOME, risk: none }
    expect: { verdict: allow }
