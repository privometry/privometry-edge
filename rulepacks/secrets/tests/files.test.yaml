schema: privometry.ruletest/v1
tests:
  - name: asks before cat .env
    covers: read-env-file
    facts: { action: shell_exec, program: cat, intent: [secret_read], category: [secrets], path_class: repo, target_path: /home/dev/api/.env, risk: high }
    expect: { verdict: ask, rule: read-env-file }
  - name: asks before the Read tool opens .env.production
    covers: read-env-file
    facts: { action: file_read, intent: [secret_read], category: [secrets], path_class: repo, target_path: /home/dev/api/.env.production, risk: high }
    expect: { verdict: ask, rule: read-env-file }
  - name: .env.example is not a secret
    covers: read-env-file
    facts: { action: file_read, path_class: repo, target_path: /home/dev/api/.env.example, risk: none }
    expect: { verdict: allow }
  - name: writing .env is not a read
    covers: read-env-file
    facts: { action: file_write, path_class: repo, target_path: /home/dev/api/.env, risk: low }
    expect: { verdict: allow }

  - name: asks before reading an SSH key
    covers: read-ssh-key
    facts: { action: shell_exec, program: cat, intent: [secret_read], path_class: secret_store, target_path: /home/dev/.ssh/id_ed25519, risk: high }
    expect: { verdict: ask, rule: read-ssh-key }
  - name: known_hosts is public
    covers: read-ssh-key
    facts: { action: file_read, path_class: secret_store, target_path: /home/dev/.ssh/known_hosts, risk: low }
    expect: { verdict: allow }

  - name: asks before reading AWS credentials
    covers: read-cloud-credentials
    facts: { action: file_read, intent: [secret_read], path_class: secret_store, target_path: /home/dev/.aws/credentials, risk: high }
    expect: { verdict: ask, rule: read-cloud-credentials }
  - name: asks before reading a kubeconfig
    covers: read-cloud-credentials
    facts: { action: shell_exec, program: cat, intent: [secret_read], path_class: secret_store, target_path: /home/dev/.kube/config, risk: high }
    expect: { verdict: ask, rule: read-cloud-credentials }
  - name: AWS config without keys is public
    covers: read-cloud-credentials
    facts: { action: file_read, path_class: secret_store, target_path: /home/dev/.aws/config, risk: low }
    expect: { verdict: allow }

  - name: asks before reading .netrc
    covers: read-credential-store
    facts: { action: shell_exec, program: cat, intent: [secret_read], path_class: secret_store, target_path: /home/dev/.netrc, risk: high }
    expect: { verdict: ask, rule: read-credential-store }
  - name: an SSH key is covered by its own rule, not the catch-all
    covers: read-credential-store
    facts: { action: file_read, intent: [secret_read], path_class: secret_store, target_path: /home/dev/.ssh/id_rsa, risk: high }
    expect: { verdict: ask, rule: read-ssh-key }

  - name: asks before reading a PEM key in the repo
    covers: read-private-key-file
    facts: { action: file_read, intent: [secret_read], path_class: repo, target_path: /home/dev/api/certs/server.key, risk: high }
    expect: { verdict: ask, rule: read-private-key-file }
  - name: a public certificate is not a key
    covers: read-private-key-file
    facts: { action: file_read, path_class: repo, target_path: /home/dev/api/certs/server.crt, risk: none }
    expect: { verdict: allow }

  - name: asks before reading Terraform state
    covers: read-terraform-state
    facts: { action: shell_exec, program: cat, intent: [secret_read], path_class: repo, target_path: /home/dev/infra/terraform.tfstate, risk: high }
    expect: { verdict: ask, rule: read-terraform-state }
  - name: Terraform code is not state
    covers: read-terraform-state
    facts: { action: file_read, path_class: repo, target_path: /home/dev/infra/main.tf, risk: none }
    expect: { verdict: allow }

  - name: asks before reading a service-account key
    covers: read-credentials-file
    facts: { action: file_read, intent: [secret_read], path_class: repo, target_path: /home/dev/api/service-account-prod.json, risk: high }
    expect: { verdict: ask, rule: read-credentials-file }
  - name: a package.json is not a credentials file
    covers: read-credentials-file
    facts: { action: file_read, path_class: repo, target_path: /home/dev/api/package.json, risk: none }
    expect: { verdict: allow }
