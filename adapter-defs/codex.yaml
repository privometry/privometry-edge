# Shipped adapter definition. Validated against specs/adapter/v1 by internal/adapters/registry tests.
schema: privometry.adapter/v1
agent: codex_cli
display_name: Codex
versions: ">=0.14.0 <1.0.0"
verified:
  - version: 0.164.0
    fixtures: codex_cli/0.164.0
detect:
  binaries: [codex]
  processes: [codex]
  # The Codex desktop app ships inside the ChatGPT app (bundle ID
  # com.openai.codex) and runs this engine as "codex app-server". It reads the
  # same ~/.codex config and hooks as the CLI (observed with 0.153.0-alpha.5).
  app_binaries:
    macos:
      - "/Applications/ChatGPT.app/Contents/Resources/codex"
      - "~/Applications/ChatGPT.app/Contents/Resources/codex"
      - "/Applications/Codex.app/Contents/Resources/codex"
  version_cmd: [codex, --version]
  bypass_flags: [--dangerously-bypass-approvals-and-sandbox]
  process_patterns: ["@openai/codex/"]
  # The desktop app's engine (app-server) and the MCP server run all day without sessions.
  no_session_args: [mcp-server, app-server]
env_overrides:
  - var: CODEX_HOME
    replaces: "~/.codex"
config_tiers:
  - tier: user
    format: toml
    holds: [settings, permissions, mcp_servers, hooks]
    paths: { any: ["~/.codex/config.toml"] }
  - tier: user
    format: json
    holds: [hooks]
    paths: { any: ["~/.codex/hooks.json"] }
  - tier: project
    format: toml
    holds: [settings, mcp_servers, hooks]
    paths: { any: [".codex/config.toml"] }
    requires_trust: true
  - tier: project
    format: json
    holds: [hooks]
    paths: { any: [".codex/hooks.json"] }
    requires_trust: true
  - tier: managed
    format: toml
    holds: [settings, permissions, hooks]
    paths:
      macos: ["/etc/codex/requirements.toml"]
      linux: ["/etc/codex/requirements.toml"]
      windows: ["%ProgramData%\\OpenAI\\Codex\\requirements.toml"]
  - tier: user
    format: starlark
    holds: [rules]
    paths: { any: ["~/.codex/rules/*.rules"] }
mcp_sources:
  - tier: user
    format: toml
    paths: { any: ["~/.codex/config.toml"] }
    pointer: /mcp_servers
  - tier: project
    format: toml
    paths: { any: [".codex/config.toml"] }
    pointer: /mcp_servers
memory_files:
  - tier: user
    kind: instructions
    format: markdown
    paths: { any: ["~/.codex/AGENTS.md", "~/.codex/AGENTS.override.md"] }
  - tier: project
    kind: instructions
    format: markdown
    nested: true
    paths: { any: ["AGENTS.md", "AGENTS.override.md"] }
    note: Read from the repo root down to the working folder; project_doc_fallback_filenames in config.toml can add other names.
  - tier: user
    kind: memory
    format: markdown
    written_by_agent: true
    paths: { any: ["~/.codex/memories/*.md"] }
    note: Experimental memories feature; the file layout is not verified yet.
hooks:
  registration: codex_hooks
  install:
    free:
      tier: user
      paths: { any: ["~/.codex/hooks.json"] }
    enterprise:
      tier: managed
      paths:
        macos: ["/etc/codex/requirements.toml"]
        linux: ["/etc/codex/requirements.toml"]
        windows: ["%ProgramData%\\OpenAI\\Codex\\requirements.toml"]
      lock: { key: allow_managed_hooks_only, value: true }
  timeout_seconds: 10
  fail_closed_option: null
  trust:
    required: true
    tiers: [user, project]
    instructions: Open Codex, run /hooks and trust the Privometry hook once; the desktop app then runs it too.
  disable_settings:
    - { pointer: /features/hooks, value: false }
    - { pointer: /features/codex_hooks, value: false }
  events:
    # Recorded with 0.164.0: payloads carry session_id, turn_id (no prompt_id),
    # transcript_path (null in codex exec), cwd, model and permission_mode.
    - name: UserPromptSubmit
      role: prompt_submit
      verdicts: []
      request:
        session_id: /session_id
        prompt_id: /turn_id
        prompt: /prompt
        cwd: /cwd
      responses:
        none: { exit_code: 0, stdout: null }
    - name: PreToolUse
      role: pre_tool
      matcher: ".*"
      verdicts: [allow, deny]
      fallback: { ask: deny }
      request: &tool_request
        session_id: /session_id
        tool_use_id: /tool_use_id
        tool_name: /tool_name
        tool_input: /tool_input
        cwd: /cwd
        permission_mode: /permission_mode
      responses:
        allow: { exit_code: 0, stdout: null }
        deny:
          exit_code: 0
          stdout:
            hookSpecificOutput:
              hookEventName: PreToolUse
              permissionDecision: deny
              permissionDecisionReason: "{message}"
    # Fires only after a tool succeeds; tool_response is text for Bash and
    # apply_patch and the MCP result object for MCP tools.
    - name: PostToolUse
      role: post_tool
      matcher: ".*"
      verdicts: []
      request:
        <<: *tool_request
        tool_response: /tool_response
      responses:
        none: { exit_code: 0, stdout: null }
    - name: SessionStart
      role: session_start
      verdicts: []
      request: { session_id: /session_id, cwd: /cwd }
      responses:
        none: { exit_code: 0, stdout: null }
    # Codex limits a SessionEnd hook to 3 seconds and warns on every run
    # when it is registered with more.
    - name: SessionEnd
      role: session_end
      timeout_seconds: 3
      verdicts: []
      request: { session_id: /session_id, cwd: /cwd }
      responses:
        none: { exit_code: 0, stdout: null }
tool_kinds:
  Bash: shell_exec
  apply_patch: file_write
  "mcp__*": mcp_call
  spawn_agent: subagent_spawn
  "*": other
tool_targets:
  Bash: { command: /command }
  apply_patch: { patch: /command }
mcp_tools:
  name_template: "mcp__{server}__{tool}"
posture_checks: [auto_approve_mode, sandbox_disabled, project_mcp_server, unpinned_mcp_server, project_hook, secret_in_config, writable_managed_config]
notes:
  - Codex hooks fail open on crash or timeout and cannot ask; Privometry sends deny with a message for ask verdicts.
  - Hosted tools such as web search are not hookable.
