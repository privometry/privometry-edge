# Shipped adapter definition. Validated against specs/adapter/v1 by internal/adapters/registry tests.
schema: privometry.adapter/v1
agent: claude_code
display_name: Claude Code
versions: ">=2.1.295 <3.0.0"   # onFailure (fail-closed hooks) arrived in 2.1.295
verified:
  - version: 2.1.304
    fixtures: claude_code/2.1.304
detect:
  binaries: [claude]
  processes: [claude]
  version_cmd: [claude, --version]
  bypass_flags: [--dangerously-skip-permissions, --permission-mode bypassPermissions]
  # The npm package and the native installer, whatever the program is called.
  process_patterns: ["@anthropic-ai/claude-code/", "claude/versions/"]
  no_session_args: ["mcp serve"]
  # Transcripts appear with the first prompt; SessionStart fires at launch.
  session_paths: { any: ["~/.claude/projects/*/*.jsonl"] }
env_overrides:
  - var: CLAUDE_CONFIG_DIR
    replaces: "~/.claude"
config_tiers:
  - tier: user
    format: json
    holds: [settings, permissions, hooks, plugins]
    paths: { any: ["~/.claude/settings.json"] }
  - tier: user
    format: json
    holds: [plugins]
    paths: { any: ["~/.claude/plugins/installed_plugins.json"] }
  - tier: project
    format: json
    holds: [settings, permissions, hooks, plugins]
    paths: { any: [".claude/settings.json", ".claude/settings.local.json"] }
  - tier: managed
    format: json
    holds: [settings, permissions, hooks]
    paths:
      macos:
        - "/Library/Application Support/ClaudeCode/managed-settings.json"
        - "/Library/Application Support/ClaudeCode/managed-settings.d/*.json"
      linux:
        - "/etc/claude-code/managed-settings.json"
        - "/etc/claude-code/managed-settings.d/*.json"
      windows:
        - "C:\\Program Files\\ClaudeCode\\managed-settings.json"
        - "C:\\Program Files\\ClaudeCode\\managed-settings.d\\*.json"
  - tier: user
    format: markdown
    holds: [skills]
    # synced/<account>/<skill> is where claude.ai-synced skills land (observed on 2.1.304, not documented).
    paths: { any: ["~/.claude/skills/*/SKILL.md", "~/.claude/skills/synced/*/*/SKILL.md"] }
  - tier: project
    format: markdown
    holds: [skills]
    paths: { any: [".claude/skills/*/SKILL.md"] }
mcp_sources:
  - tier: user
    format: json
    paths: { any: ["~/.claude.json"] }
    pointer: /mcpServers
  - tier: user
    format: json
    paths: { any: ["~/.claude.json"] }
    pointer: /projects/*/mcpServers
  - tier: project
    format: json
    paths: { any: [".mcp.json"] }
    pointer: /mcpServers
memory_files:
  # Loaded into every session; the InstructionsLoaded hook reports each load
  # with memory_type User, Project, Local or Managed.
  - tier: managed
    kind: instructions
    format: markdown
    imports: true
    paths:
      macos: ["/Library/Application Support/ClaudeCode/CLAUDE.md"]
      linux: ["/etc/claude-code/CLAUDE.md"]
      windows: ["C:\\Program Files\\ClaudeCode\\CLAUDE.md"]
  - tier: user
    kind: instructions
    format: markdown
    imports: true
    paths: { any: ["~/.claude/CLAUDE.md"] }
  - tier: user
    kind: rules
    format: markdown
    paths: { any: ["~/.claude/rules/*.md", "~/.claude/rules/*/*.md"] }
  - tier: project
    kind: instructions
    format: markdown
    imports: true
    nested: true
    paths: { any: ["CLAUDE.md", ".claude/CLAUDE.md"] }
  - tier: project
    kind: instructions
    format: markdown
    imports: true
    paths: { any: ["CLAUDE.local.md"] }
    note: Personal project instructions (memory_type Local), usually not committed.
  - tier: project
    kind: rules
    format: markdown
    paths: { any: [".claude/rules/*.md", ".claude/rules/*/*.md"] }
    note: Rules with paths frontmatter load only when matching files are touched.
  - tier: user
    kind: memory
    format: markdown
    written_by_agent: true
    paths: { any: ["~/.claude/projects/*/memory/*.md"] }
    note: Automatic memory, one folder per project with a MEMORY.md index (observed on 2.1.304).
hooks:
  registration: claude_settings
  install:
    free:
      tier: user
      paths: { any: ["~/.claude/settings.json"] }
    enterprise:
      tier: managed
      paths:
        macos: ["/Library/Application Support/ClaudeCode/managed-settings.d/50-privometry.json"]
        linux: ["/etc/claude-code/managed-settings.d/50-privometry.json"]
        windows: ["C:\\Program Files\\ClaudeCode\\managed-settings.d\\50-privometry.json"]
      lock: { key: allowManagedHooksOnly, value: true }
  timeout_seconds: 10
  fail_closed_option: { key: onFailure, value: block, min_version: 2.1.295 }
  trust: { required: false }
  imported_by:
    - agent: cursor
      default_enabled: true
      setting: Third-Party Imports
  # Turns off every hook, Privometry's included, in whichever settings file sets it.
  disable_settings:
    - { pointer: /disableAllHooks, value: true }
  events:
    - name: PreToolUse
      role: pre_tool
      matcher: "*"
      verdicts: [allow, ask, deny]
      request: &tool_request
        session_id: /session_id
        tool_use_id: /tool_use_id
        tool_name: /tool_name
        tool_input: /tool_input
        cwd: /cwd
        permission_mode: /permission_mode
        mcp_server: /mcp_server/name
      responses:
        allow:
          exit_code: 0
          stdout:
            hookSpecificOutput:
              hookEventName: PreToolUse
              permissionDecision: allow
              permissionDecisionReason: "{message}"
        ask:
          exit_code: 0
          stdout:
            hookSpecificOutput:
              hookEventName: PreToolUse
              permissionDecision: ask
              permissionDecisionReason: "{message}"
        deny:
          exit_code: 0
          stdout:
            hookSpecificOutput:
              hookEventName: PreToolUse
              permissionDecision: deny
              permissionDecisionReason: "{message}"
    - name: PostToolUse
      role: post_tool
      matcher: "*"
      verdicts: []
      request:
        <<: *tool_request
        tool_response: /tool_response
      responses:
        none: { exit_code: 0, stdout: null }
    - name: SessionStart
      role: session_start
      verdicts: []
      request: { session_id: /session_id, cwd: /cwd }
      responses:
        none: { exit_code: 0, stdout: null }
    - name: SessionEnd
      role: session_end
      verdicts: []
      request: { session_id: /session_id, cwd: /cwd }
      responses:
        none: { exit_code: 0, stdout: null }
    - name: ConfigChange
      role: config_change
      verdicts: []
      request: { session_id: /session_id, cwd: /cwd, config_source: /source, config_path: /file_path }
      responses:
        none: { exit_code: 0, stdout: null }
    - name: InstructionsLoaded
      role: instructions_loaded
      verdicts: []
      request: { session_id: /session_id, cwd: /cwd, file_path: /file_path, memory_type: /memory_type, load_reason: /load_reason }
      responses:
        none: { exit_code: 0, stdout: null }
tool_kinds:
  Bash: shell_exec
  PowerShell: shell_exec
  Read: file_read
  Glob: file_read
  Grep: file_read
  Write: file_write
  Edit: file_write
  NotebookEdit: file_write
  WebFetch: network_fetch
  WebSearch: web_search
  Agent: subagent_spawn
  Task: subagent_spawn
  "mcp__*": mcp_call
  "*": other
tool_targets:
  Bash: { command: /command }
  PowerShell: { command: /command }
  Read: { path: /file_path }
  Write: { path: /file_path, content: /content }
  Edit: { path: /file_path, content: /new_string }
  NotebookEdit: { path: /notebook_path, content: /new_source }
  Glob: { path: /path }
  Grep: { path: /path }
  WebFetch: { url: /url }
  WebSearch: { query: /query }
mcp_tools:
  name_template: "mcp__{server}__{tool}"
posture_checks: [auto_approve_mode, managed_hooks_only_off, project_mcp_server, unpinned_mcp_server, project_hook, secret_in_config, writable_managed_config]
