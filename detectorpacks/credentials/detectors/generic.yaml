# Credentials recognized by shape and context rather than a provider prefix.
# When a provider detector finds the same value, only its finding is kept.
schema: privometry.detectors/v1
detectors:
  - id: jwt
    title: JSON Web Token
    category: credential
    kind: pattern
    severity: medium
    confidence: medium
    secret_type: jwt
    applies_to: &everywhere [action_argument, file_write, memory_file, agent_config, skill, tool_output, repo]
    keywords: [eyj]
    pattern: '\b(?P<secret>eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{16,})'
    samples:
      match: ['Cookie: session=ey{{}}JhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NSIsIm5hbWUiOiJkZXYifQ.8GjHEAD6-Wj9KfzjsQGMrb9h_ImB_LK777pzNk8cL6j']
      no_match: ['eyJhbGciOiJIUzI1NiJ9 is a base64 JSON header']

  - id: database-url-password
    title: Password in a connection string
    category: credential
    kind: entropy
    severity: high
    confidence: medium
    secret_type: database_url
    applies_to: *everywhere
    keywords: [postgres, mysql, mariadb, mongodb, redis, amqp, mssql, sqlserver]
    pattern: '(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|rediss?|amqps?|mssql|sqlserver)://[^\s:/@]+:(?P<secret>[^\s@/$%{<][^\s@/]{7,})@[^\s/]+' # a value starting with $, %, { or < is a variable reference
    min_entropy: 2.8
    min_length: 8
    samples:
      match: ['DATABASE_URL=postgres://app:Xq7{{}}#mK2vL9pR@db.internal:5432/app']
      no_match: ['postgres://user@localhost/db', 'postgres://app:password@localhost/app', 'mongodb://root:${MONGO_PASSWORD}@mongo:27017']

  - id: bearer-token
    title: Bearer token in an Authorization header
    category: credential
    kind: entropy
    severity: high
    confidence: medium
    secret_type: bearer_token
    applies_to: *everywhere
    keywords: [bearer]
    pattern: '(?i)\bauthorization\s*:\s*bearer\s+(?P<secret>[A-Za-z0-9._~+/=-]{20,})'
    min_entropy: 3.5
    min_length: 20
    samples:
      match: ['curl -H "Authorization: Bearer -5IXAAjlsHUq{{}}JoUD_.Ydua.5ZMs1SWOpQaPRYpzb" https://api.example.net']
      no_match: ['Authorization: Bearer $TOKEN', 'Authorization: Bearer xxxxxxxxxxxxxxxxxxxxxxxx']

  - id: secret-assignment
    title: Random value assigned to a secret-named variable
    category: credential
    kind: entropy
    severity: medium
    confidence: medium
    secret_type: generic_secret
    applies_to: *everywhere
    keywords: [secret, token, password, passwd, api_key, apikey, access_key, private_key, auth]
    pattern: '(?i)(?:secret|token|passw(?:or)?d|api_?key|access_?key|private_?key|auth)[A-Za-z0-9_]*["'']?\s*[:=]\s*["'']?(?P<secret>[A-Za-z0-9+/_=-]{16,})'
    min_entropy: 3.6
    min_length: 16
    samples:
      match: ['API_KEY="5Vsqxezy3Lex{{}}7BWr2drgd1QsO7jprBGu"', 'client_secret: 5Vsqxezy3Lex{{}}7BWr2drgd1QsO7jprBGu']
      no_match: ['API_KEY=your-api-key-here', 'token: process.env.GITHUB_TOKEN', 'password = "aaaaaaaaaaaaaaaaaaaa"', 'TOKEN_URL=https://auth.example.net/token']
