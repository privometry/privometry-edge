# Provider token formats. Samples are fake but correctly formed; {{}} keeps
# them from being contiguous in the repository and is removed before matching.
schema: privometry.detectors/v1
detectors:
  - id: aws-access-key
    title: AWS access key ID
    category: credential
    kind: pattern
    severity: high
    confidence: high
    secret_type: aws_access_key
    applies_to: &everywhere [action_argument, file_write, memory_file, agent_config, skill, tool_output, repo]
    keywords: [akia, asia, abia, acca]
    pattern: '\b(?P<secret>(?:AKIA|ASIA|ABIA|ACCA)[A-Z0-9]{16})\b'
    allow: ['AKIA{{}}IOSFODNN7EXAMPLE'] # AWS's documented example key
    samples:
      match: ['aws configure set aws_access_key_id AKIA{{}}UJZDE8GXD6NCF10E']
      no_match: ['AKIA{{}}IOSFODNN7EXAMPLE is the example key in the AWS docs', 'AKIASHORT']

  - id: aws-secret-key
    title: AWS secret access key
    category: credential
    kind: pattern
    severity: critical
    confidence: high
    secret_type: aws_secret_key
    applies_to: *everywhere
    keywords: [aws_secret, awssecret, secret_access_key, secretaccesskey]
    pattern: '(?i)aws_?secret_?(?:access_?)?key["'']?\s*[:=]\s*["'']?(?P<secret>[A-Za-z0-9/+]{40})(?:[^A-Za-z0-9/+]|$)'
    allow: ['wJalrXUtnFEMI/K7MDENG/bPxRfi{{}}CYEXAMPLEKEY']
    samples:
      match: ['export AWS_SECRET_ACCESS_KEY=pfJBd0Kh8o{{}}hYgCfrL1spNxnyVmihA+2O76UMFxFk']
      no_match: ['AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfi{{}}CYEXAMPLEKEY', 'AWS_SECRET_ACCESS_KEY=${AWS_SECRET}']

  - id: github-token
    title: GitHub token
    category: credential
    kind: pattern
    severity: high
    confidence: high
    secret_type: github_token
    applies_to: *everywhere
    keywords: [ghp_, gho_, ghu_, ghs_, ghr_]
    pattern: '\b(?P<secret>gh[pousr]_[A-Za-z0-9]{36,255})\b'
    samples:
      match: ['curl -H "Authorization: Bearer gh{{}}p_KtHF4vUCsMehGAkWvj7FAc9QeWJKY40uvSwM" https://api.github.com/user']
      no_match: ['ghp_short', 'set GITHUB_TOKEN in your CI secrets']

  - id: github-fine-grained-token
    title: GitHub fine-grained token
    category: credential
    kind: pattern
    severity: high
    confidence: high
    secret_type: github_token
    applies_to: *everywhere
    keywords: [github_pat_]
    pattern: '\b(?P<secret>github_pat_[A-Za-z0-9_]{82})\b'
    samples:
      match: ['GH_TOKEN=github_{{}}pat_FLZDe1f8rESQedUStPKR0CsTy4Qwb8DwkNhFdnXsiVpzz63FfkCzJr4i0B3JrTAwR4y9ojfljoQoaF1Llq']
      no_match: ['github_pat_ is the prefix of fine-grained tokens']

  - id: gitlab-token
    title: GitLab personal access token
    category: credential
    kind: pattern
    severity: high
    confidence: high
    secret_type: gitlab_token
    applies_to: *everywhere
    keywords: [glpat-]
    pattern: '\b(?P<secret>glpat-[A-Za-z0-9_-]{20,})'
    samples:
      match: ['git clone https://oauth2:glp{{}}at-sajAIxNKu8iS2G8NPRVd@gitlab.com/acme/api.git']
      no_match: ['glpat-xxxx']

  - id: slack-token
    title: Slack token
    category: credential
    kind: pattern
    severity: high
    confidence: high
    secret_type: slack_token
    applies_to: *everywhere
    keywords: [xoxb-, xoxa-, xoxp-, xoxr-, xoxs-]
    pattern: '\b(?P<secret>xox[baprs]-[0-9]{10,13}-[0-9]{10,13}(?:-[A-Za-z0-9]{24,34})?)\b'
    samples:
      match: ['SLACK_BOT_TOKEN=xo{{}}xb-78666617603-1372159010928-g8xNbe3nNyjOq9wMxEhh2FDE']
      no_match: ['xoxb-your-token-here']

  - id: slack-webhook
    title: Slack incoming webhook
    category: credential
    kind: pattern
    severity: high
    confidence: high
    secret_type: slack_webhook
    applies_to: *everywhere
    keywords: [hooks.slack.com]
    pattern: '(?P<secret>https://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[A-Za-z0-9]{24})'
    samples:
      match: ['curl -X POST -d @msg.json https://hooks.slack.com/services/T{{}}4TFJGVQ4K7/BBN7XJ8B7TF/S2qHx6kwXoIIXGvOoNZYW2mZ']
      no_match: ['https://hooks.slack.com/services/T000/B000/XXXX']

  - id: stripe-live-key
    title: Stripe live secret key
    category: credential
    kind: pattern
    severity: critical
    confidence: high
    secret_type: stripe_key
    applies_to: *everywhere
    keywords: [sk_live_, rk_live_]
    pattern: '\b(?P<secret>(?:sk|rk)_live_[A-Za-z0-9]{24,})'
    samples:
      match: ['stripe.api_key = "sk_{{}}live_p0zVZomHFwUbbYrEqmSM9wCZ"']
      no_match: ['sk_test_p0zVZomHFwUbbYrEqmSM9wCZ is a test-mode key']

  - id: openai-api-key
    title: OpenAI API key
    category: credential
    kind: pattern
    severity: high
    confidence: high
    secret_type: openai_api_key
    applies_to: *everywhere
    keywords: [t3blbkfj]
    pattern: '\b(?P<secret>sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,}T3BlbkFJ[A-Za-z0-9_-]{20,})'
    samples:
      match: ['OPENAI_API_KEY=sk-proj-{{}}SUkCnD8zRA9a9SkpXz9w3QlY7Zkuvqdt7s8Stqcbnr3yBdGBT3BlbkFJLEPH1qhT61qtc4xatws8phP9nhFyJfm5di4PzJ59FHz5r1pY']
      no_match: ['OPENAI_API_KEY=sk-...']

  - id: anthropic-api-key
    title: Anthropic API key
    category: credential
    kind: pattern
    severity: high
    confidence: high
    secret_type: anthropic_api_key
    applies_to: *everywhere
    keywords: [sk-ant-]
    pattern: '\b(?P<secret>sk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_-]{80,})'
    samples:
      match: ['ANTHROPIC_API_KEY=sk-ant-{{}}api03-4OjE2jBMptUsGr7CmY_uCu3ZR1zTOlUcR64cXQLioDnkHIfxIq2HZt-PlJhx2jIclHkCiHp6bR1IqfEouHgxzNNAL5wISAA']
      no_match: ['ANTHROPIC_API_KEY=sk-ant-...']

  - id: google-api-key
    title: Google API key
    category: credential
    kind: pattern
    severity: high
    confidence: high
    secret_type: google_api_key
    applies_to: *everywhere
    keywords: [aiza]
    pattern: '\b(?P<secret>AIza[0-9A-Za-z_-]{35})'
    samples:
      match: ['const firebaseKey = "AI{{}}zacGebcy8F5n3-YNBDRzrZSgqbjG3uhkWKFLf";']
      no_match: ['AIzaShort']

  - id: gcp-service-account-key
    title: Google Cloud service account key
    category: credential
    kind: pattern
    severity: critical
    confidence: high
    secret_type: gcp_service_account_key
    applies_to: *everywhere
    keywords: [private_key_id]
    pattern: '"private_key_id"\s*:\s*"(?P<secret>[0-9a-f]{40})"'
    samples:
      match: ['{"type": "service_account", "project_id": "acme", "private_key_id": "24c1c099724caf49{{}}41d4072014b3ce107f80e222"}']
      no_match: ['"private_key_id": ""']

  - id: npm-token
    title: npm access token
    category: credential
    kind: pattern
    severity: high
    confidence: high
    secret_type: npm_token
    applies_to: *everywhere
    keywords: [npm_]
    pattern: '\b(?P<secret>npm_[A-Za-z0-9]{36})\b'
    samples:
      match: ['//registry.npmjs.org/:_authToken=np{{}}m_DlkrCaqx9vJupc94tnwlavyfErGPmpGXafq0']
      no_match: ['npm_config_cache=/tmp/npm']

  - id: private-key
    title: Private key
    category: credential
    kind: pattern
    severity: critical
    confidence: high
    secret_type: private_key
    applies_to: *everywhere
    keywords: [private key]
    pattern: '(?P<secret>-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----)'
    samples:
      match: ["-----BEGIN {{}}OPENSSH PRIVATE KEY-----\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQ"]
      no_match: ['-----BEGIN PUBLIC KEY-----', 'Never commit a private key.']
