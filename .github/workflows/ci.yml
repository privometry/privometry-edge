name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatted with gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      # The race detector needs cgo on Windows; the named-pipe, ACL, DPAPI and
      # lock tests run here.
      - run: go test ./...
        if: runner.os == 'Windows'
      - run: make build
        if: runner.os != 'Windows'
      - run: go build ./cmd/...
        if: runner.os == 'Windows'
      - name: Generated Go types are up to date
        run: go run ./scripts/gen-types -check
      - name: Generated pkg/edge facade is up to date
        run: go run ./scripts/gen-facade -check
      - name: Generated conformance vectors are up to date
        run: go run ./scripts/gen-conformance && git diff --exit-code -- specs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4

  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
