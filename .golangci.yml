version: "2"
linters:
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors: errcheck reports the same calls
    staticcheck:
      # The defaults, plus QF1001: the negated conditions it would rewrite read closer to their intent.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001"]
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Test setup writes fixtures into temporary directories; a failed write fails the test anyway.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # Developer tools that write generated files into the repo, from paths given on their command line.
      - path: ^scripts/
        linters:
          - gosec
        text: "G301|G306|G703"
formatters:
  enable:
    - gofmt
    - goimports
