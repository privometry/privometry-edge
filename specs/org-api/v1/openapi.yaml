webhooks:
  event:
    post:
      operationId: deliverWebhookEvent
      summary: What Privometry sends to a webhook's URL.
      description: |
        A JSON WebhookEvent signed as Standard Webhooks specify. Check
        webhook-signature against v1, then the base64 HMAC-SHA256 of
        "{webhook-id}.{webhook-timestamp}.{body}" keyed with the base64-decoded
        secret after whsec_; reject timestamps more than 5 minutes off; use
        webhook-id to drop repeats. Answer 2xx within 15 seconds; anything
        else is retried. After a secret rotation, webhook-signature carries
        two space-separated signatures, the new secret's first, until the
        previous secret expires: accept the request when either matches.
      parameters:
        - name: webhook-id
          in: header
          required: true
          schema:
            $ref: 'messages.schema.json#/$defs/webhook_event_id'
        - name: webhook-timestamp
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9]{10}$' }
        - name: webhook-signature
          in: header
          required: true
          schema: { type: string, pattern: '^v1,[A-Za-z0-9+/]{43}=( v1,[A-Za-z0-9+/]{43}=)?$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'messages.schema.json#/$defs/WebhookEvent'
      responses:
        '2XX':
          description: Received.

components:
  securitySchemes:
    consoleSession:
      type: apiKey
      in: cookie
      name: __Host-privometry_session
      description: The console session from account-api/v1. Requests that change state must send an Origin header matching the console.
    apiKey:
      type: http
      scheme: bearer
      description: An organization API key (pak_...) from account-api/v1.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Unique per logical request; the server returns the first result for retries by the same caller within 24 hours.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    OrgID:
      name: org_id
      in: path
      required: true
      schema:
        $ref: '../../common/v1/common.schema.json#/$defs/org_id'
    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema:
        $ref: 'messages.schema.json#/$defs/webhook_id'
    PolicyID:
      name: policy_id
      in: path
      required: true
      schema:
        $ref: '../../common/v1/common.schema.json#/$defs/policy_id'

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: The request does not match the contract (invalid-request; errors lists each field by JSON pointer).
      content:
        application/problem+json:
          schema:
            $ref: '../../edge-api/v1/messages.schema.json#/$defs/Problem'
    Unauthorized:
      description: No valid session or API key (not-signed-in, api-key-invalid).
      content:
        application/problem+json:
          schema:
            $ref: '../../edge-api/v1/messages.schema.json#/$defs/Problem'
    Forbidden:
      description: A role or API key scope that may not do this (not-allowed).
      content:
        application/problem+json:
          schema:
            $ref: '../../edge-api/v1/messages.schema.json#/$defs/Problem'
    NotFound:
      description: No such policy, version or workspace in the organization (not-found).
      content:
        application/problem+json:
          schema:
            $ref: '../../edge-api/v1/messages.schema.json#/$defs/Problem'
    Conflict:
      description: |
        version-conflict: the policy changed since base_version.
        policy-name-taken: another active policy has this name.
        policy-name-changed: a new version renames the policy.
        policy-archived: the policy is archived.
      content:
        application/problem+json:
          schema:
            $ref: '../../edge-api/v1/messages.schema.json#/$defs/Problem'
    PolicyInvalid:
      description: The YAML is not a valid policy, or does not compile to valid Cedar (policy-invalid; errors lists each problem, by JSON pointer into the YAML where there is one).
      content:
        application/problem+json:
          schema:
            $ref: '../../edge-api/v1/messages.schema.json#/$defs/Problem'
    TooManyRequests:
      description: Rate limited; retry after the given delay.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '../../edge-api/v1/messages.schema.json#/$defs/Problem'
    ServerError:
      description: Retry with backoff.
      content:
        application/problem+json:
          schema:
            $ref: '../../edge-api/v1/messages.schema.json#/$defs/Problem'
