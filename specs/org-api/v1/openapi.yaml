openapi: 3.1.0
info:
  title: Privometry organization API
  version: 1.0.0-draft.9
  summary: What an organization manages from the console or with an API key.
  description: |
    Served by the organization's home region. The console calls it with the
    session cookie; scripts and integrations call it with an organization
    API key (account-api/v1). Each milestone adds its resources here:
    policies and bundles first (PRD CP-10, CP-11, CP-12, CP-14).

    Policies:
    - A policy is a privometry.policy/v1 YAML file. Every change makes a new,
      immutable version; rollback makes a new version with an earlier one's
      content, so history is never rewritten.
    - A change names the version it was made from (base_version). If the
      policy has moved on since, it is refused with version-conflict.
    - The policy's name (inside the YAML) qualifies its rule IDs, so it is
      unique in the organization and cannot change between versions.
    - Rules roll out in monitor mode first (mode: monitor on a rule, or
      defaults.mode), which records would_verdict and never blocks; switching
      a rule to enforce is a new version.
    - Before saving, the service compiles the YAML with the same compiler as
      the edge (specs/conformance/policy-compile) and validates the Cedar
      against privometry.cedarschema. POST /orgs/{org_id}/policies:check does
      this without saving.

    Bundles:
    - Every policy change publishes a new bundle (policy/v1 bundle.schema.json),
      signed with the region's policy key: one for the organization and one
      for each workspace with policies of its own, all with the same version.
      Devices fetch theirs from GET /edge/v1/bundle on their next refresh.
    - A bundle carries the organization layer's YAML (sources), its compiled
      Cedar, the signed entitlements and the catalog. Each device merges the
      organization layer with its built-in packs and local policies.

    Webhooks (PRD CP-29):
    - Owners and admins (and admin API keys) subscribe URLs to findings,
      policies, inventory, events and approvals. Deliveries are signed as
      Standard Webhooks specify (webhook-id, webhook-timestamp,
      webhook-signature; see WebhookCreated.secret), retried for about a day,
      and each event is sent once per webhook with the same webhook-id on
      every retry. The top-level webhooks section describes the request.
    - Destinations must be https and resolve to public addresses; redirects
      are not followed.

    Licensing and billing (PRD LIC-01 to LIC-05, LIC-10, CP-30):
    - Features are checked by key (entitlements/v1), never by edition. An
      organization without a feature can still read what it has; changes
      that need the feature are refused with not-entitled.
    - Trials and paid periods end at valid_until, then a grace period keeps
      everything working; after it the organization is downgraded to free,
      and its cloud events are deleted after post_expiry_retention_days.
      Local protection never depends on any of this.
    - Seats are active developers. More of them than seats is allowed for a
      grace period; after it new devices are refused, nothing else.
    - Owners subscribe and change seats here; Razorpay (INR) and Paddle (USD)
      take the payment and issue invoices. Billing never decides features.

    Access:
    - Viewers and up read; owners and admins (and admin API keys) change.
    - An API key limited to a workspace sees organization policies and its
      workspace's, and changes only its workspace's.
    - Every POST that changes state takes an Idempotency-Key.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://{region}.api.privometry.dev/api/v1
    description: The organization's home region. The host name is a placeholder until it is registered.
    variables:
      region:
        default: in
        enum: [in]

security:
  - consoleSession: []
  - apiKey: []

tags:
  - name: policies
  - name: bundles
  - name: events
  - name: inventory
  - name: catalog
  - name: findings
  - name: credentials
  - name: integrations
  - name: approvals
  - name: webhooks
  - name: overview
  - name: licensing
  - name: billing

paths:
  /orgs/{org_id}/policies:
    get:
      operationId: listPolicies
      tags: [policies]
      summary: Active policies (viewer and up).
      parameters:
        - $ref: '#/components/parameters/OrgID'
      responses:
        '200':
          description: Policies at their current version, without content.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/PolicyList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: createPolicy
      tags: [policies]
      summary: Create a policy at version 1 and publish a bundle (owners, admins, admin API keys).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'messages.schema.json#/$defs/PolicyCreate'
      responses:
        '201':
          description: Created, with its content.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/Policy'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PolicyInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/policies:check:
    post:
      operationId: checkPolicy
      tags: [policies]
      summary: Validate and compile YAML without saving it (analyst and up).
      parameters:
        - $ref: '#/components/parameters/OrgID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'messages.schema.json#/$defs/PolicyCheck'
      responses:
        '200':
          description: The result; an invalid policy is still a 200 with valid false.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/PolicyCheckResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/policies/{policy_id}:
    get:
      operationId: getPolicy
      tags: [policies]
      summary: A policy at its current version, with content (viewer and up).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/PolicyID'
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/Policy'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    delete:
      operationId: archivePolicy
      tags: [policies]
      summary: Archive a policy so devices drop it with the next bundle; its versions are kept (owners, admins, admin API keys).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/PolicyID'
      responses:
        '204':
          description: Archived and a bundle published; archiving again changes nothing.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/policies/{policy_id}/versions:
    get:
      operationId: listPolicyVersions
      tags: [policies]
      summary: Every version, newest first (viewer and up).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/PolicyID'
      responses:
        '200':
          description: Versions without content.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/PolicyVersionList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: createPolicyVersion
      tags: [policies]
      summary: Change a policy and publish a bundle (owners, admins, admin API keys).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/PolicyID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'messages.schema.json#/$defs/PolicyVersionCreate'
      responses:
        '201':
          description: The new version.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/PolicyVersion'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PolicyInvalid' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/policies/{policy_id}/versions/{version}:
    get:
      operationId: getPolicyVersion
      tags: [policies]
      summary: One version with its content and compiled Cedar (viewer and up).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/PolicyID'
        - name: version
          in: path
          required: true
          schema:
            $ref: 'messages.schema.json#/$defs/policy_version'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/PolicyVersion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/policies/{policy_id}/diff:
    get:
      operationId: diffPolicyVersions
      tags: [policies]
      summary: What changed between two versions (viewer and up).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/PolicyID'
        - name: from
          in: query
          required: true
          schema:
            $ref: 'messages.schema.json#/$defs/policy_version'
        - name: to
          in: query
          description: Defaults to the current version.
          schema:
            $ref: 'messages.schema.json#/$defs/policy_version'
      responses:
        '200':
          description: The diff.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/PolicyDiff'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/policies/{policy_id}:rollback:
    post:
      operationId: rollbackPolicy
      tags: [policies]
      summary: Make a new version with an earlier version's content and publish a bundle (owners, admins, admin API keys).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/PolicyID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'messages.schema.json#/$defs/PolicyRollback'
      responses:
        '201':
          description: The new version.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/PolicyVersion'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/bundles:
    get:
      operationId: listBundles
      tags: [bundles]
      summary: Signed bundles, newest first (viewer and up).
      parameters:
        - $ref: '#/components/parameters/OrgID'
      responses:
        '200':
          description: Bundles without content.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/BundleList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: publishBundle
      tags: [bundles]
      summary: Sign new bundles now, for example after the catalog or entitlements changed (owners, admins, organization-wide admin API keys).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'messages.schema.json#/$defs/BundlePublish'
      responses:
        '201':
          description: The bundles signed, organization first.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/BundleList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/events:
    get:
      operationId: searchEvents
      tags: [events]
      summary: Search the organization's events, newest first (viewer and up; PRD CP-06).
      description: |
        Events are searchable within seconds of upload and kept for the
        organization's retention_days entitlement. They are stored as uploaded:
        commands and paths redacted, local usernames hashed with the
        organization's key. An API key limited to a workspace sees the events
        of that workspace's devices.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - name: type
          in: query
          schema: { enum: [action, config, integrity, fail_mode, inventory, prompt, content_finding] }
        - name: device_id
          in: query
          schema:
            $ref: '../../common/v1/common.schema.json#/$defs/device_id'
        - name: session_id
          in: query
          schema:
            $ref: '../../common/v1/common.schema.json#/$defs/session_id'
        - name: verdict
          in: query
          schema:
            $ref: '../../common/v1/common.schema.json#/$defs/verdict'
        - name: rule_id
          in: query
          schema:
            $ref: '../../policy/v1/policy.schema.json#/$defs/qualified_rule_ref'
        - name: agent_product
          in: query
          schema:
            $ref: '../../common/v1/common.schema.json#/$defs/agent_product'
        - name: from
          in: query
          description: Events that occurred at or after this time.
          schema:
            $ref: '../../common/v1/common.schema.json#/$defs/timestamp'
        - name: to
          in: query
          description: Events that occurred before this time.
          schema:
            $ref: '../../common/v1/common.schema.json#/$defs/timestamp'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: cursor
          in: query
          description: next_cursor from the previous page.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,512}$' }
      responses:
        '200':
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/EventPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/inventory/components:
    get:
      operationId: listComponents
      tags: [inventory]
      summary: Agents, MCP servers, skills, plugins, hooks and IDE extensions on the organization's devices, with their catalog status (viewer and up; PRD CP-07, CP-09).
      description: catalog_status=unknown lists shadow AI, components not in the catalog. A workspace API key counts only its workspace's devices.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - name: kind
          in: query
          schema: { enum: [agent, mcp_server, skill, plugin, hook, ide_extension] }
        - name: catalog_status
          in: query
          schema:
            $ref: '../../common/v1/common.schema.json#/$defs/catalog_status'
        - name: agent_product
          in: query
          schema:
            $ref: '../../common/v1/common.schema.json#/$defs/agent_product'
      responses:
        '200':
          description: Components installed now.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/ComponentList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/inventory/agents:
    get:
      operationId: listAgentInstances
      tags: [inventory]
      summary: Each agent on each device, with what it can reach (viewer and up; PRD CP-07).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - name: device_id
          in: query
          schema:
            $ref: '../../common/v1/common.schema.json#/$defs/device_id'
      responses:
        '200':
          description: Agents present now.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/AgentInstanceList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/catalog:
    get:
      operationId: listCatalog
      tags: [catalog]
      summary: The organization's approved and blocked components (viewer and up).
      parameters:
        - $ref: '#/components/parameters/OrgID'
      responses:
        '200':
          description: Entries, newest first.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/CatalogEntryList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: createCatalogEntry
      tags: [catalog]
      summary: Approve or block a component and publish a bundle (owners, admins, organization-wide admin API keys).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'messages.schema.json#/$defs/CatalogEntryCreate'
      responses:
        '201':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/CatalogEntry'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/catalog/{catalog_entry_id}:
    delete:
      operationId: deleteCatalogEntry
      tags: [catalog]
      summary: Remove an entry and publish a bundle (owners, admins, organization-wide admin API keys).
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - name: catalog_entry_id
          in: path
          required: true
          schema:
            $ref: 'messages.schema.json#/$defs/catalog_entry_id'
      responses:
        '204':
          description: Removed; removing again changes nothing.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/findings:
    get:
      operationId: listFindings
      tags: [findings]
      summary: Posture, drift, tamper and health findings, newest first (viewer and up; PRD CP-15 basic).
      description: |
        Findings come from devices: posture issues in inventory snapshots,
        hooks reported missing or modified in heartbeats and integrity events
        (tamper), and devices without a heartbeat for a day (health). A repeat
        of an open finding updates it; a cleared condition resolves it. A
        workspace API key sees its workspace's devices' findings.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - name: status
          in: query
          schema:
            $ref: 'messages.schema.json#/$defs/finding_status'
        - name: type
          in: query
          schema: { enum: [posture, drift, tamper, health] }
        - name: severity
          in: query
          schema: { enum: [low, medium, high, critical] }
      responses:
        '200':
          description: Up to 500 findings.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/FindingList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/findings/{finding_id}:triage:
    post:
      operationId: triageFinding
      tags: [findings]
      summary: Change a finding's status or owner (analyst and up). A linked ticket gets a comment.
      parameters:
        - $ref: '#/components/parameters/OrgID'
        - name: finding_id
          in: path
          required: true
          schema:
            $ref: 'messages.schema.json#/$defs/finding_id'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'messages.schema.json#/$defs/FindingTriage'
      responses:
        '200':
          description: The finding.
          content:
            application/json:
              schema:
                $ref: 'messages.schema.json#/$defs/Finding'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /orgs/{org_id}/credentials:
    get:
      operationId: listCredentials
      tags: [credentials]
      summary: Leaked secrets tracked across devices, most recently seen first (analyst and up; PRD SCAN-15).
      description: |
        Built from content findings that enrolled devices upload: a device
        keys each credential's fingerprint with the organization's hash key,
        so the same secret found on several devices is one credential here.
