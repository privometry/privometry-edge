<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Privometry local guard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2236%22%20height=%2236%22%20viewBox=%220%200%2036%2036%22%20fill=%22none%22%3E%20%3Crect%20width=%2236%22%20height=%2236%22%20rx=%228%22%20fill=%22%23315CF5%22/%3E%20%3Cpath%20d=%22M11%2027.1V15.9a7%207%200%200%201%2014%200v11.2%22%20stroke=%22%23FFFFFF%22%20stroke-width=%223.2%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%20%3Ccircle%20cx=%2218%22%20cy=%2223.88%22%20r=%222.8%22%20fill=%22%23FFFFFF%22/%3E%20%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="app" class="l-app">
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Local guard navigation">
      <div class="sb-brand"><svg class="mark" width="26" height="26" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M8 31V15a10 10 0 0 1 20 0v16" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="26.4" r="3.6" fill="currentColor"/></svg><b>Privometry</b></div>
      <div class="machine">
        <span class="tile" id="tile" aria-hidden="true">?</span>
        <div><b id="host">This machine</b><small>Local guard</small></div>
      </div>
      <nav class="sb-nav" id="nav">
        <div class="nav-group">
          <div class="nav-label">Monitor</div>
          <button type="button" data-view="timeline"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span>Timeline</span></button>
          <button type="button" data-view="sessions"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4zM8 9l3 3-3 3M13 15h3"/></svg><span>Sessions</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-label">Protect</div>
          <button type="button" data-view="scan"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM12 8v5M12 16h.01"/></svg><span>Scan</span><span class="count" id="scan-count" hidden></span></button>
          <button type="button" data-view="policy"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9l-6-6zM14 3v6h6M9 13h6M9 17h6"/></svg><span>Policy</span></button>
        </div>
        <div class="nav-group">
          <div class="nav-label">Machine</div>
          <button type="button" data-view="device"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v12H3zM8 20h8M12 16v4"/></svg><span>Device</span></button>
        </div>
      </nav>
      <div class="sb-foot">
        <div class="sb-status" id="status" role="status"></div>
        <div class="user"><span class="avatar" id="avatar">?</span><div><span id="user">You</span><small>On this machine</small></div></div>
      </div>
    </aside>
    <div class="scrim-m" id="scrim"></div>
    <div class="main" id="scroller">
      <header class="toolbar">
        <button type="button" class="x menu" id="menu" aria-label="Open menu"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <span class="tb-mark"><svg class="mark" width="22" height="22" viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M8 31V15a10 10 0 0 1 20 0v16" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="26.4" r="3.6" fill="currentColor"/></svg></span>
        <nav class="crumbs" aria-label="Breadcrumb"><span id="crumb-host">This machine</span><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg><b id="crumb-view">Timeline</b></nav>
        <div class="tools">
          <button type="button" class="live" id="live" aria-pressed="true"><span class="dot"></span><span>Live</span></button>
          <span class="tool-label">Theme</span>
          <div class="seg theme-seg" role="group" aria-label="Theme">
            <button type="button" data-theme="light" aria-pressed="false" aria-label="Light"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><span>Light</span></button>
            <button type="button" data-theme="dark" aria-pressed="false" aria-label="Dark"><svg class="ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span>Dark</span></button>
          </div>
        </div>
      </header>
      <main class="page" id="main" tabindex="-1"></main>
    </div>
  </div>
</div>
<div id="layer"></div>
</body>
</html>
